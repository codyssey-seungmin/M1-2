services:
  - type: web
    name: pageful-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: codyssey
      - key: CODYSSEY_API_KEY
        sync: false
      - key: CODYSSEY_MODEL
        sync: false
      - key: CODYSSEY_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
